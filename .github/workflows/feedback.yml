name: compiler feedback
on:
  pull_request:
    paths: ['src/graph/**', 'src/feedback/**', 'fixtures/feedback/**', 'test/graph-feedback.test.ts', 'scripts/feedback.ts', 'scripts/compare-feedback.mjs', 'scripts/compare-feedback.test.mjs', 'scripts/verify-compiler.ts', 'package.json', 'bun.lock', '.github/workflows/feedback.yml']
  push:
    branches: [main]
    paths: ['src/graph/**', 'src/feedback/**', 'fixtures/feedback/**', 'test/graph-feedback.test.ts', 'scripts/feedback.ts', 'scripts/compare-feedback.mjs', 'scripts/compare-feedback.test.mjs', 'scripts/verify-compiler.ts', 'package.json', 'bun.lock', '.github/workflows/feedback.yml']
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: Compiler commit or branch to test without changing the baseline pin
        default: main
        type: string
permissions:
  contents: read
concurrency:
  group: compiler-feedback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  feedback:
    name: graph feedback (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [pinned, candidate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/checkout@v4
        if: matrix.compiler == 'candidate'
        with:
          repository: typeshade/typeshade
          ref: ${{ inputs.compiler_ref || 'main' }}
          path: .compiler-candidate
          persist-credentials: false
      - name: Install and verify the candidate source archive
        if: matrix.compiler == 'candidate'
        run: |
          git -C .compiler-candidate archive --prefix=package/ --format=tar.gz --output="$RUNNER_TEMP/typeshade-candidate.tar.gz" HEAD
          echo "TYPESHADE_CANDIDATE_SHA=$(git -C .compiler-candidate rev-parse HEAD)" >> "$GITHUB_ENV"
          bun add --dev --exact "$RUNNER_TEMP/typeshade-candidate.tar.gz" --ignore-scripts
          bun scripts/verify-compiler.ts .compiler-candidate
          bun run prepare
      - run: bun run check
      - run: bun run test
      - run: bun run feedback --out .feedback/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-feedback-${{ matrix.compiler }}
          path: .feedback/
  compare:
    name: graph candidate parity
    needs: feedback
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: graph-feedback-pinned
          path: .feedback/pinned
      - uses: actions/download-artifact@v4
        with:
          name: graph-feedback-candidate
          path: .feedback/candidate
      - run: node --test scripts/compare-feedback.test.mjs
      - run: node scripts/compare-feedback.mjs .feedback/pinned/report.json .feedback/candidate/report.json
